name: Approved one-time v0.6.32 candidate request
on:
  push:
    paths:
      - '.github/workflows/request-v0.6.32-build.yml'
permissions:
  actions: write
  contents: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request manually gated private candidate build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run linux-build.yml --ref main
