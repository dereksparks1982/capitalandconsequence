name: Build filing cabinet open sound

on:
  push:
    paths:
      - '.github/workflows/analyze-filing-cabinet.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Cut opening half only
        shell: bash
        run: |
          set -euo pipefail
          SRC="assets/audio/freesound_community-filing-cabinet-89398.mp3"
          OUT="assets/audio/filing-cabinet-open.mp3"
          test -s "$SRC"
          ffmpeg -y -hide_banner -loglevel error -ss 0 -t 2.40 -i "$SRC"             -af "afade=t=out:st=2.34:d=0.06"             -ac 1 -ar 44100 -b:a 64k "$OUT"
          test -s "$OUT"

      - name: Commit opening clip and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Federal Electric Build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/audio/filing-cabinet-open.mp3
          git rm .github/workflows/analyze-filing-cabinet.yml
          git commit -m "Add filing cabinet opening sound"
          git push origin main
