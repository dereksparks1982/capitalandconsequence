name: Import title night ambience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-night-ambience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-night-ambience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover and fetch night ambience
        run: |
          python -m pip install --disable-pip-version-check selenium requests
          python - <<'PY'
          from pathlib import Path
          import time, requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          page='https://pixabay.com/sound-effects/city-street-at-night-with-cars-49378/'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--autoplay-policy=no-user-gesture-required')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
              driver.get(page)
              time.sleep(3)
              driver.execute_script("""
                const a=document.querySelector('audio');
                if(a){ a.muted=true; a.play().catch(()=>{}); }
                const b=[...document.querySelectorAll('button')].find(x=>/play/i.test(x.getAttribute('aria-label')||x.textContent||''));
                if(b) b.click();
              """)
              time.sleep(4)
              urls=driver.execute_script("""
                return performance.getEntriesByType('resource')
                  .map(e=>e.name)
                  .filter(n=>/\.mp3(?:\?|$)/i.test(n) || /audio/i.test(n));
              """)
              audio_src=driver.execute_script("""
                const a=document.querySelector('audio');
                return a ? (a.currentSrc || a.src || '') : '';
              """)
              if audio_src:
                  urls.insert(0,audio_src)
          finally:
              driver.quit()

          seen=[]
          for u in urls:
              if u and u not in seen:
                  seen.append(u)
          print('Candidates:', *seen, sep='\n')
          headers={'User-Agent':'Mozilla/5.0','Referer':page}
          out=Path('assets/audio/title-night-street.mp3')
          out.parent.mkdir(parents=True,exist_ok=True)
          for u in seen:
              try:
                  r=requests.get(u,headers=headers,timeout=60,allow_redirects=True)
                  ct=(r.headers.get('content-type') or '').lower()
                  if r.ok and len(r.content)>1000000 and ('audio' in ct or r.content[:3]==b'ID3' or r.content[:2] in (b'\xff\xfb',b'\xff\xf3',b'\xff\xf2')):
                      out.write_bytes(r.content)
                      print('Saved',u,'as',out,'bytes',len(r.content),'content-type',ct)
                      break
              except Exception as exc:
                  print('Candidate failed',u,exc)
          if not out.exists():
              raise SystemExit('Could not recover the Pixabay MP3 stream')
          PY

      - name: Commit night ambience
        run: |
          git config user.name "Federal Electric Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/audio/title-night-street.mp3
          git commit -m "Add local nighttime street ambience"
          git push
