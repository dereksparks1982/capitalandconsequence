# Sparse source QA on relevant maritime-chart source updates; otherwise manual only.
# Owner approved sparing GitHub Actions use November 2, 2026.
name: Capital and Consequence source regression
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-regression-check.yml
      - merchant-navigation.js
      - merchant-chart.js
      - merchant-world-map.js
      - merchant-world-map.css
      - merchant-chart-camera.js
      - tests/merchant-chart-camera.cjs
      - tests/merchant-mitchell-chart.cjs
      - tests/github-source-test-registry.cjs
      - tests/source-contracts.cjs
      - tests/character-menu-portraits.cjs
      - tests/peacock-debts.cjs
      - tests/peacock-favor-story.cjs
      - tests/peacock-network.cjs
      - desktop/main.cjs
      - scripts/linux-root-launcher.c
      - scripts/build-root-linux.cjs
permissions:
  contents: read
jobs:
  offline-source:
    name: All offline source regressions (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source (no build artifacts)
        uses: actions/checkout@v4
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete offline source QA suite
        run: node tests/run-all.cjs

  native-packaged:
    name: Native packaged Linux game smoke (without user flags)
    needs: offline-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the real game source
        uses: actions/checkout@v4
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron and local game dependencies
        run: npm install --no-audit --no-fund
      - name: Build and smoke the actual Linux executable on a virtual desktop
        shell: bash
        run: |
          command -v xvfb-run
          status=0
          xvfb-run -a -s "-screen 0 1440x900x24" env XDG_SESSION_TYPE=x11 npm run build:root:linux > native-smoke.log 2>&1 || status=$?
          tail -n 140 native-smoke.log
          if [ "$status" -ne 0 ]; then
            echo "Native packaging or smoke failed with status $status"
            exit "$status"
          fi
          grep -F "PACKAGED ELECTRON SMOKE TEST PASSED." native-smoke.log
          test -x capitalandconsequence
          test -x capitalandconsequence-runtime
          test -s resources/app.asar
          echo "Verified the exact root executable from a real successful packed Electron smoke."

      - name: Native Wayland compositor startup check with unchanged game launcher
        shell: bash
        run: |
          if ! command -v weston >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq weston
          fi
          runtime_dir="$(mktemp -d)"
          chmod 700 "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" weston --backend=headless-backend.so --renderer=pixman --no-config --socket=capital-wayland-ci --width=1440 --height=900 --idle-time=0 --log="$PWD/weston-headless.log" &
          compositor_pid=$!
          trap 'kill "$compositor_pid" 2>/dev/null || true; rm -rf "$runtime_dir"' EXIT
          for i in $(seq 1 80); do
            if [ -S "$runtime_dir/capital-wayland-ci" ]; then break; fi
            sleep 0.25
          done
          test -S "$runtime_dir/capital-wayland-ci" || { tail -n 60 weston-headless.log; exit 1; }
          status=0
          timeout 45s env -u DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=wayland XDG_RUNTIME_DIR="$runtime_dir" WAYLAND_DISPLAY=capital-wayland-ci ./capitalandconsequence --graphics-smoke > wayland-smoke.log 2>&1 || status=$?
          tail -n 110 wayland-smoke.log
          if [ "$status" -ne 0 ]; then
            echo "Native Wayland smoke failed with status $status"
            exit "$status"
          fi
          grep -F "CAPITAL_WAYLAND_BOOT_OK" wayland-smoke.log
          if grep -F "'--ozone-platform=wayland' is not compatible with Vulkan" wayland-smoke.log; then
            echo "The Vulkan/Wayland startup problem is not fixed."
            exit 1
          fi
          echo "Native Wayland graphics and renderer startup passed without player compatibility arguments."
