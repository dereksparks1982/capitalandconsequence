name: Federal Electric Source QA
# Lightweight source checks only; NEVER package or publish a game on push.
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'journey-planner.js'
      - 'calendar-bridge.js'
      - 'city.js'
      - 'npc-ai.js'
      - 'npc-calendar.js'
      - 'living-characters.js'
      - 'character-routes.js'
      - 'venue-opportunities.js'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'build-linux.sh'
      - '.github/workflows/linux-build.yml'
      - '.github/workflows/source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Source contracts (no packaging)
        run: npm run test:source
