name: Capital & Consequence Source QA
# Lightweight source checks only; NEVER package or publish a game on push.
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'journey-planner.js'
      - 'calendar-bridge.js'
      - 'time-transactions.js'
      - 'washington-time.js'
      - 'city.js'
      - 'national-districts.js'
      - 'npc-ai.js'
      - 'npc-calendar.js'
      - 'npc-itinerary.js'
      - 'npc-agency.js'
      - 'npc-intentions.js'
      - 'npc-social.js'
      - 'npc-witness.js'
      - 'npc-rumors.js'
      - 'npc-language.js'
      - 'npc-dialogue.js'
      - 'world-canon.js'
      - 'sky-cycle.js'
      - 'vendor/astronomy-engine/**'
      - 'desktop/npc-llm.cjs'
      - 'desktop/preload.cjs'
      - 'component-works.js'
      - 'component-works-live.js'
      - 'component-works-panel.js'
      - 'npc-economy.js'
      - 'npc-mobility.js'
      - 'patrol-duty.js'
      - 'patrol-ui.js'
      - 'doorman-duty.js'
      - 'orderly-duty.js'
      - 'orderly-ui.js'
      - 'doorman-ui.js'
      - 'city-access.js'
      - 'career-shell.js'
      - 'desktop/main.cjs'
      - 'murder-cases.js'
      - 'detective-cases.js'
      - 'living-characters.js'
      - 'character-routes.js'
      - 'venue-opportunities.js'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'build-linux.sh'
      - '.github/workflows/linux-build.yml'
      - '.github/workflows/source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Source contracts (no packaging)
        run: npm run test:source
