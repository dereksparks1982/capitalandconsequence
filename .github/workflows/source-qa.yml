name: Capital & Consequence Source QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-qa:
    name: Warnings are errors
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in world-canon.js npc-ai.js npc-economy.js npc-calendar.js gambling-law.js club-memberships.js championships.js boxing-championship.js boxing.js historical-people.js fight-club-brotherhood.js underworld.js app.js city.js poker.js racing.js; do
            node --check "$script"
          done
      - name: Run all required source tests
        run: npm run test:source
