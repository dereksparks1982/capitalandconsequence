name: One-time Linux Candidate Request
on:
  push:
    branches: [main]
    paths:
      - BUILD-REQUEST-v0.6.86.md
permissions:
  actions: write
  contents: read
jobs:
  dispatch-owner-requested-linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke existing manual-only Linux Desktop Build once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linux-build.yml --repo "$GITHUB_REPOSITORY" --ref main
