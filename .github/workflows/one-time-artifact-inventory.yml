name: One-time obsolete artifact inventory
on:
  push:
    branches: [main]
    paths:
      - ARTIFACT-INVENTORY-REQUEST.md
permissions:
  contents: read
  actions: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect old build artifact usage without deleting anything
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .size_in_bytes, .expired, .created_at, .workflow_run.id] | @tsv' > /tmp/cc-artifacts.tsv
          echo "ARTIFACT_COUNT=$(wc -l < /tmp/cc-artifacts.tsv)"
          awk -F'\t' '{s+=$3} END {printf "ARTIFACT_TOTAL_BYTES=%.0f\n", s}' /tmp/cc-artifacts.tsv
          echo 'ARTIFACT_GROUPS_BEGIN'
          awk -F'\t' '{cnt[$2]++;size[$2]+=$3} END {for (n in cnt) printf "%d\t%.0f\t%s\n",cnt[n],size[n],n}' /tmp/cc-artifacts.tsv | sort -k2,2nr | head -50
          echo 'ARTIFACT_GROUPS_END'
          echo 'LARGEST_ARTIFACTS_BEGIN'
          sort -t $'\t' -k3,3nr /tmp/cc-artifacts.tsv | head -60
          echo 'LARGEST_ARTIFACTS_END'
