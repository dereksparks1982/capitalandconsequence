name: Linux Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'desktop/**'
      - 'index.html'
      - 'app.js'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'radio/**'
      - 'vendor/**'
      - '.github/workflows/linux-build.yml'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Copy runtime web dependencies into the game
        run: npm run prepare:runtime

      - name: Build portable Linux directory
        run: npm run pack:linux

      - name: Build double-click Linux launcher
        run: |
          mv dist/linux-unpacked/federal-electric dist/linux-unpacked/federal-electric-bin
          cat > /tmp/federal-electric-launcher.c <<'EOF'
          #define _GNU_SOURCE
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
            char self[PATH_MAX];
            ssize_t n = readlink("/proc/self/exe", self, sizeof(self) - 1);
            if (n < 0) {
              perror("Federal Electric launcher");
              return 1;
            }
            self[n] = '\0';
            char *slash = strrchr(self, '/');
            if (!slash) return 1;
            *slash = '\0';

            char target[PATH_MAX];
            if (snprintf(target, sizeof(target), "%s/federal-electric-bin", self) >= (int)sizeof(target)) {
              return 1;
            }

            char **next = calloc((size_t)argc + 2, sizeof(char *));
            if (!next) return 1;
            next[0] = target;
            next[1] = "--no-sandbox";
            for (int i = 1; i < argc; i++) next[i + 1] = argv[i];
            next[argc + 1] = NULL;

            execv(target, next);
            perror("Federal Electric");
            free(next);
            return 1;
          }
          EOF
          gcc -O2 -s /tmp/federal-electric-launcher.c -o dist/linux-unpacked/federal-electric
          chmod 0755 dist/linux-unpacked/federal-electric
          ln -s federal-electric "dist/linux-unpacked/Federal Electric"

      - name: Smoke-test exact double-click launcher
        run: |
          xvfb-run -a timeout 30s dist/linux-unpacked/federal-electric --smoke-test

      - name: Package standalone alpha
        run: |
          mv dist/linux-unpacked "dist/Federal Electric Standalone"
          tar -C dist -czf "dist/Federal-Electric-0.5.0-alpha.1-linux-x64.tar.gz" "Federal Electric Standalone"

      - name: Upload private Linux standalone alpha
        uses: actions/upload-artifact@v4
        with:
          name: Federal-Electric-Linux-standalone
          path: dist/Federal-Electric-0.5.0-alpha.1-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
