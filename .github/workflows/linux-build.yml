name: Linux Desktop Build

# Developer workflow is manual-only while multiple 0.6.88 source slices are underway.
# Do not build/publish an executable just because source was pushed to main.
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out private source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test source contracts and save-model foundations
        run: npm run test:source

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Copy runtime web dependencies into the game
        run: npm run prepare:runtime

      - name: Verify reorganized artwork paths
        run: npm run audit:artwork

      - name: Audit packaged runtime for network dependencies
        run: npm run audit:offline

      - name: Build portable Linux directory
        run: npm run pack:linux

      - name: Build double-click Linux launcher
        run: |
          mv dist/linux-unpacked/capital-consequence dist/linux-unpacked/capital-consequence-bin
          cat > /tmp/capital-consequence-launcher.c <<'EOF'
          #define _GNU_SOURCE
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
            char self[PATH_MAX];
            ssize_t n = readlink("/proc/self/exe", self, sizeof(self) - 1);
            if (n < 0) {
              perror("Capital & Consequence launcher");
              return 1;
            }
            self[n] = '\0';
            char *slash = strrchr(self, '/');
            if (!slash) return 1;
            *slash = '\0';

            char target[PATH_MAX];
            if (snprintf(target, sizeof(target), "%s/capital-consequence-bin", self) >= (int)sizeof(target)) {
              return 1;
            }

            char **next = calloc((size_t)argc + 2, sizeof(char *));
            if (!next) return 1;
            next[0] = target;
            next[1] = "--no-sandbox";
            for (int i = 1; i < argc; i++) next[i + 1] = argv[i];
            next[argc + 1] = NULL;

            execv(target, next);
            perror("Capital & Consequence");
            free(next);
            return 1;
          }
          EOF
          gcc -Wall -Wextra -Werror -O2 -s /tmp/capital-consequence-launcher.c -o dist/linux-unpacked/capital-consequence
          chmod 0755 dist/linux-unpacked/capital-consequence
          ln -s capital-consequence "dist/linux-unpacked/Capital & Consequence"

      - name: Smoke-test exact double-click launcher
        run: |
          xvfb-run -a timeout 30s dist/linux-unpacked/capital-consequence --smoke-test

      - name: Package standalone alpha
        run: |
          mv dist/linux-unpacked "dist/Capital & Consequence Standalone"
          tar -C dist -czf "dist/Capital-and-Consequence-0.6.88-linux-x64.tar.gz" "Capital & Consequence Standalone"
          (cd dist && sha256sum Capital-and-Consequence-0.6.88-linux-x64.tar.gz > Capital-and-Consequence-0.6.88-linux-x64.tar.gz.sha256)

      - name: Verify Linux archive checksum
        run: |
          set -euo pipefail
          test -s "dist/Capital-and-Consequence-0.6.88-linux-x64.tar.gz"
          test -s "dist/Capital-and-Consequence-0.6.88-linux-x64.tar.gz.sha256"
          (cd dist && sha256sum --check Capital-and-Consequence-0.6.88-linux-x64.tar.gz.sha256)

      - name: Upload private unaccepted Linux test build
        uses: actions/upload-artifact@v4
        with:
          name: Capital-and-Consequence-v0.6.88-Linux-UNACCEPTED
          path: |
            dist/Capital-and-Consequence-0.6.88-linux-x64.tar.gz
            dist/Capital-and-Consequence-0.6.88-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
