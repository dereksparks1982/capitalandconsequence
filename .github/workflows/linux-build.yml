name: Linux Desktop Build

# Developer workflow is manual-only while multiple 0.6.41 source slices are underway.
# Do not build/publish an executable just because source was pushed to main.
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out private source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test source contracts and save-model foundations
        run: npm run test:source

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Copy runtime web dependencies into the game
        run: npm run prepare:runtime

      - name: Verify reorganized artwork paths
        run: npm run audit:artwork

      - name: Audit packaged runtime for network dependencies
        run: npm run audit:offline

      - name: Build portable Linux directory
        run: npm run pack:linux

      - name: Build double-click Linux launcher
        run: |
          mv dist/linux-unpacked/federal-electric dist/linux-unpacked/federal-electric-bin
          cat > /tmp/federal-electric-launcher.c <<'EOF'
          #define _GNU_SOURCE
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
            char self[PATH_MAX];
            ssize_t n = readlink("/proc/self/exe", self, sizeof(self) - 1);
            if (n < 0) {
              perror("Federal Electric launcher");
              return 1;
            }
            self[n] = '\0';
            char *slash = strrchr(self, '/');
            if (!slash) return 1;
            *slash = '\0';

            char target[PATH_MAX];
            if (snprintf(target, sizeof(target), "%s/federal-electric-bin", self) >= (int)sizeof(target)) {
              return 1;
            }

            char **next = calloc((size_t)argc + 2, sizeof(char *));
            if (!next) return 1;
            next[0] = target;
            next[1] = "--no-sandbox";
            for (int i = 1; i < argc; i++) next[i + 1] = argv[i];
            next[argc + 1] = NULL;

            execv(target, next);
            perror("Federal Electric");
            free(next);
            return 1;
          }
          EOF
          gcc -Wall -Wextra -Werror -O2 -s /tmp/federal-electric-launcher.c -o dist/linux-unpacked/federal-electric
          chmod 0755 dist/linux-unpacked/federal-electric
          ln -s federal-electric "dist/linux-unpacked/Federal Electric"

      - name: Smoke-test exact double-click launcher
        run: |
          xvfb-run -a timeout 30s dist/linux-unpacked/federal-electric --smoke-test

      - name: Package standalone alpha
        run: |
          mv dist/linux-unpacked "dist/Federal Electric Standalone"
          tar -C dist -czf "dist/Federal-Electric-0.6.41-linux-x64.tar.gz" "Federal Electric Standalone"
          (cd dist && sha256sum Federal-Electric-0.6.41-linux-x64.tar.gz > Federal-Electric-0.6.41-linux-x64.tar.gz.sha256)

      # GitHub Actions artifact storage is full. Draft release assets use GitHub
      # Releases storage instead, while preserving existing artifacts and backups.
      # A draft is NOT an accepted release. GitHub does not create a tag until
      # the draft is published, which requires explicit owner acceptance.
      - name: Upload private unaccepted Linux candidate (draft release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="candidate-v0.6.41-unaccepted"
          archive="dist/Federal-Electric-0.6.41-linux-x64.tar.gz"
          checksum="${archive}.sha256"
          title="Federal Electric v0.6.41 | UNACCEPTED LINUX CANDIDATE"
          notes="Private Linux test candidate built from commit ${GITHUB_SHA}. NOT ACCEPTED, NOT PUBLISHED. This draft does not represent an approved game release. Validate the executable before release acceptance or tagging."
          test -s "$archive"
          test -s "$checksum"
          (cd dist && sha256sum --check "Federal-Electric-0.6.41-linux-x64.tar.gz.sha256")
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true" || {
              echo "Refusing to overwrite a published release." >&2
              exit 1
            }
            gh release edit "$tag" --title "$title" --notes "$notes" --target "$GITHUB_SHA"
            gh release upload "$tag" "$archive" "$checksum" --clobber
          else
            gh release create "$tag" "$archive" "$checksum" \
              --draft --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true"
          for asset in "$archive" "$checksum"; do
            name="$(basename "$asset")"
            local_size="$(stat -c '%s' "$asset")"
            uploaded_size="$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$name\") | .size")"
            test "$local_size" = "$uploaded_size" || {
              echo "Uploaded asset missing or has incorrect size: $name" >&2
              exit 1
            }
          done
          echo "CANDIDATE_DRAFT_ASSETS_VERIFIED: package + SHA-256, still unaccepted"
