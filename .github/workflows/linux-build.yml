name: Linux Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'desktop/**'
      - 'index.html'
      - 'app.js'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'radio/**'
      - 'vendor/**'
      - '.github/workflows/linux-build.yml'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Upload private Linux alpha
        uses: actions/upload-artifact@v4
        with:
          name: Federal-Electric-Linux-alpha
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
