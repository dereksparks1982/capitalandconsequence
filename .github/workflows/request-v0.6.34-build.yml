name: One-shot v0.6.34 Build Request
on:
  push:
    paths:
      - '.github/workflows/request-v0.6.34-build.yml'
permissions:
  contents: read
  actions: write
jobs:
  request-linux-candidate:
    if: "${{ github.event.head_commit.message == 'ci: request v0.6.34 Linux candidate' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Run manual-only Linux candidate workflow once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run linux-build.yml --ref main
