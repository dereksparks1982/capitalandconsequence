name: One-time Cleanup of Superseded Failed QA Runs
on:
  push:
    branches: [main]
    paths: [CI-FAILED-RUN-CLEANUP-REQUEST.md]
permissions:
  actions: write
  contents: read
jobs:
  obsolete-source-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove only obsolete failed source QA histories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_pass="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40069611982" --jq '.conclusion')"
          test "$latest_pass" = "success" || { echo 'Refusing cleanup without verified passing v0.6.88 source suite'; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=failure&per_page=100" --jq '.workflow_runs[] | [.id, .name, .created_at] | @tsv' > /tmp/failed-runs.tsv
          echo "FAILURE_RECORDS_ENUMERATED=$(wc -l < /tmp/failed-runs.tsv)"
          selected=0
          removed=0
          refused=0
          while IFS=$'\t' read -r id name created; do
            if [[ "$name" != 'Capital & Consequence Source QA' ]]; then continue; fi
            if [[ ! "$created" < '2026-10-24T06:17:23Z' ]]; then continue; fi
            selected=$((selected+1))
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null; then
              removed=$((removed+1))
            else
              refused=$((refused+1))
            fi
          done < /tmp/failed-runs.tsv
          echo "OBSOLETE_FAILED_SOURCE_QA_SELECTED=$selected"
          echo "OBSOLETE_FAILED_SOURCE_QA_REMOVED=$removed"
          echo "OBSOLETE_FAILED_SOURCE_QA_DENIED=$refused"
          test "$refused" -eq 0 || exit 1
          # Preserve every successful run and all Linux build runs, including the
          # artifact-quota diagnostic, and leave commits, releases and all files untouched.
