name: One-time Layout Diagnostic Request
on:
  push:
    branches: [main]
    paths:
      - BUILD-REQUEST-v0.6.86-DIAG.md
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch original manual-only candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linux-build.yml --repo "$GITHUB_REPOSITORY" --ref main
